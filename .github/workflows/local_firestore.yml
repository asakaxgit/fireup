name: fireup local — Firestore, Datastore, Auth

# Triggers are deliberately left off, matching integration_tests.yml: CI in this
# repository is currently manual-only ("TEMPORARILY DISABLED - Re-enable after
# code preparation"). Turning automatic runs back on is one decision for the
# whole repo, not something this workflow should decide on its own.
#
# TODO: re-enable alongside integration_tests.yml.
# on:
#   push:
#     branches: [ main ]
#   pull_request:
#     branches: [ main ]

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast layer: drives the server over real gRPC with our generated stubs.
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Was actions-rs/toolchain@v1, which is archived and whose Node runner
      # GitHub no longer supports — actionlint flags it, and it will stop
      # starting at all when the deadline passes. The replacement takes no
      # `toolchain:`/`override:` inputs: the toolchain is the action ref
      # (`@stable`) and it is always made the rustup default, so the two inputs
      # have no equivalent here rather than a renamed one.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-local-firestore-${{ hashFiles('**/Cargo.lock') }}

      # First, because a workflow file GitHub cannot read makes every other job
      # in this file unreachable — and that is not a hypothetical here, see the
      # note on the next step. Checks that every file under .github/workflows/
      # parses and has a name, an `on:` and jobs with steps.
      - name: Workflow files are readable by GitHub
        run: cargo test --test workflow_yaml_tests

      - name: Data plane unit tests
        # Quoted on purpose: a trailing `::` in an unquoted scalar makes YAML
        # read the line as a mapping key, and GitHub then rejects the whole
        # file — every push produced a "workflow file issue" failure until this
        # was quoted, so the job had never actually run.
        #
        # What that failure looks like, written down because it was misread
        # once already: GitHub does not skip an unreadable workflow file. It
        # manufactures a run for the *push* event even though the only trigger
        # here is `workflow_dispatch`, concludes it `failure` with zero jobs,
        # and titles it by **path** instead of by `name:` — it never parsed far
        # enough to read `name:`. The annotation on that run is the real
        # message: "Invalid workflow file: You have an error in your yaml
        # syntax on line 44".
        #
        # And it hides well, because a manual `workflow_dispatch` keeps working
        # off the last version GitHub could parse: whoever dispatches by hand
        # sees green while every push shows a red X.
        #
        # tests/workflow_yaml_tests.rs now parses every file in this directory
        # from `cargo test`, and keeps the broken line as a negative control.
        # That test is the guard; this comment is why it exists.
        run: "cargo test --lib local::"

      - name: Firestore gRPC tests
        run: cargo test --test local_firestore_tests

      # Needs no server: it compares the fidelity matrix in
      # docs/local/README.md with tests/conformance/matrix.json, so a row whose
      # documented status no longer matches what the suite demands fails here in
      # a second rather than in the SDK job minutes later.
      - name: Fidelity matrix / docs are in sync
        run: cargo test --test fidelity_matrix_tests

  # Conclusive layer: drives the server with Google's own client library, which
  # picks its own RPCs and does its own serialization. The Rust tests can pass
  # while this one fails, which is exactly why it exists.
  sdk-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The same SDK checks against both stores: a durable backend that
        # disagrees with the in-memory one has to fail here, not in someone's
        # local debugging session.
        store: [memory, postgres]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fireup_local
          POSTGRES_USER: fireup
          POSTGRES_PASSWORD: fireup_ci_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/local-smoke/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-local-firestore-${{ hashFiles('**/Cargo.lock') }}

      - name: Install the official Firestore client library
        working-directory: tests/local-smoke
        run: npm ci --no-audit --no-fund

      - name: SDK smoke test (in-memory store)
        if: matrix.store == 'memory'
        run: scripts/smoke-local-firestore.sh

      - name: SDK smoke test (PostgreSQL store)
        if: matrix.store == 'postgres'
        env:
          FIREUP_SMOKE_POSTGRES_URL: postgresql://fireup:fireup_ci_password@localhost:5432/fireup_local
        run: scripts/smoke-local-firestore.sh

      - name: Durable store conformance tests
        if: matrix.store == 'postgres'
        env:
          FIREUP_TEST_POSTGRES_URL: postgresql://fireup:fireup_ci_password@localhost:5432/fireup_local
        run: cargo test --test local_postgres_store_tests

  # The regression shield for the fidelity matrix: one probe per documented row,
  # driven by the official Node and Python client libraries. A served row that
  # stops working fails here; so does an UNIMPLEMENTED row that stops failing
  # clearly, or a row somebody flipped in the README without writing its check.
  #
  # Both stores, because "the matrix holds" has to be true of the durable
  # backend too — a Postgres store that disagrees with the in-memory one has to
  # fail in CI, not in someone's local debugging session.
  sdk-conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        store: [memory, postgres]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fireup_conformance
          POSTGRES_USER: fireup
          POSTGRES_PASSWORD: fireup_ci_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/conformance/node/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-local-firestore-${{ hashFiles('**/Cargo.lock') }}

      - name: Install the official Node client libraries
        working-directory: tests/conformance/node
        run: npm ci --no-audit --no-fund

      - name: Install the official Node auth client libraries
        working-directory: tests/local-smoke
        run: npm ci --no-audit --no-fund

      - name: Install the official Python client libraries
        run: python -m pip install -r tests/conformance/python/requirements.txt

      - name: SDK conformance (in-memory store)
        if: matrix.store == 'memory'
        env:
          FIREUP_CONFORMANCE_PYTHON: python
        run: scripts/conformance-local.sh

      - name: SDK conformance (PostgreSQL store)
        if: matrix.store == 'postgres'
        env:
          FIREUP_CONFORMANCE_PYTHON: python
          FIREUP_CONFORMANCE_POSTGRES_URL: postgresql://fireup:fireup_ci_password@localhost:5432/fireup_conformance
        run: scripts/conformance-local.sh
