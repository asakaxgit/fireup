name: Integration Tests

# Runs on every pull request and on pushes to main. Soft skips in
# tests/integration_tests.rs panic under CI when Postgres URL or backup
# fixtures are missing, so this workflow cannot go vacuous again.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  integration-tests:
    name: integration tests (Postgres service)
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: fireup_test
      POSTGRES_USER: fireup
      POSTGRES_PASSWORD: fireup_test_password

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-integration-${{ hashFiles('Cargo.lock') }}

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U "${{ env.POSTGRES_USER }}"; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run integration tests
        env:
          # Required: postgres_test_env panics under CI when this is missing.
          FIREUP_TEST_POSTGRES_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          TEST_DATABASE_URL: postgresql://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          # GHA runners have Docker. Without this, test_docker_container_integration
          # starts Compose on :5433 while this job's URL points at the service on
          # :5432, so the persistence check can pass against the wrong database.
          # The dedicated docker-integration job owns that test.
          FIREUP_SKIP_DOCKER: "1"
        # Serial: these tests share one fireup_data schema on the service DB.
        run: cargo test --locked --test integration_tests -- --nocapture --test-threads=1

  docker-integration:
    name: docker compose postgres integration
    runs-on: ubuntu-latest

    # Keep compose defaults (fireup / fireup_dev_password / fireup_dev). Do not
    # inherit the Postgres-service job's password — that made auth fail.
    env:
      POSTGRES_DB: fireup_dev
      POSTGRES_USER: fireup
      POSTGRES_PASSWORD: fireup_dev_password

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-integration-docker-${{ hashFiles('Cargo.lock') }}

      - name: Start PostgreSQL with Docker Compose
        run: |
          docker compose up -d postgres
          for _ in $(seq 1 30); do
            if docker exec fireup_postgres pg_isready -U fireup -d fireup_dev; then
              break
            fi
            sleep 2
          done
          docker exec fireup_postgres pg_isready -U fireup -d fireup_dev

      - name: Run docker-backed integration test
        env:
          # Opt into the docker-only test; missing Docker then panics.
          FIREUP_TEST_DOCKER: "1"
          # Compose publishes Postgres on host 5433 by default.
          FIREUP_TEST_POSTGRES_URL: postgresql://fireup:fireup_dev_password@localhost:5433/fireup_dev
        run: cargo test --locked --test integration_tests test_docker_container_integration -- --nocapture --test-threads=1

      - name: Cleanup Docker resources
        if: always()
        run: docker compose down -v
