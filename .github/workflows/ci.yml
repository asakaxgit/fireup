name: CI

# The workflow the README's CI badge reports on, and the only one in this
# directory that runs on every commit.
#
# Scope is chosen so that red means "the code is broken", never "a service did
# not come up": the `test` job runs with nothing but a Rust toolchain — no
# PostgreSQL, no Node, no Docker, no network. The suites that need those live in
# `local_firestore.yml` (the official-SDK conformance layer) and
# `integration_tests.yml`, which stay manual for now — except the official-SDK
# smoke suites, which the `fidelity` job at the bottom runs on every pull request
# as a regression gate.
#
# The `deny` job is the one exception to "no network": it fetches the RustSec
# advisory database, which is the whole point of it. It is a separate job rather
# than a step in `test` so that a supply-chain failure is never mistaken for a
# broken build, and so it reports in seconds instead of waiting on a compile.
#
# Deliberately not here yet: `cargo fmt --check` and `cargo clippy -D warnings`.
# Both are currently failing on `main` for reasons that predate this workflow,
# so adding them would ship a permanently red badge and teach everyone to
# ignore it. Cleaning them up and adding them as a job is its own task.
on:
  push:
    branches: [main]
  # No branch filter on pull requests, on purpose. Overlapping work in this
  # repository is stacked (one PR based on another, not on `main`), so a
  # `branches: [main]` filter would skip exactly the PRs that most need
  # checking — every layer of a stack but the bottom one.
  #
  # Removing the filter is necessary but not sufficient: GitHub only schedules a
  # `pull_request` run for a workflow that already exists on the PR's **base**
  # branch. Measured on this very PR — the layer above it (base
  # `sak-206/badges-matrix`, which carries this file) got automatic CI, while
  # this PR (base `sak-203/...`, which predates the file) got none and had to be
  # checked by `workflow_dispatch`. That resolves itself the moment this lands on
  # `main`; until then, dispatch manually and say so in the PR.
  pull_request:
  workflow_dispatch:

# Least privilege for every job in this workflow, declared here rather than left
# to the repository's `default_workflow_permissions` setting — which lives in the
# web UI, outside this tree, and can be widened to `write` with no commit, no
# pull request and no review. It reads `read` today; this line is what makes that
# a fact about the repository rather than a fact about a checkbox.
#
# The `deny` job is the one that most wants a read-only token: it is the only job
# here that deliberately goes to the network, and what it does there is download
# a third-party binary and run it — in a workspace where `actions/checkout` has,
# by default (`persist-credentials: true`), written this token into `.git/config`.
#
# `dependency_pin_tests` fails if this block goes away or gains a `write`, for any
# scope and in any job (#96).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build and test (no external services)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo --version && rustc --version

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Keyed on the lock file, so the cache is invalidated by the exact
          # resolved versions rather than by the semver ranges in Cargo.toml.
          key: ${{ runner.os }}-ci-${{ hashFiles('Cargo.lock') }}

      # `--locked` on every cargo invocation. Cargo.lock is committed, so this
      # job builds the exact dependency versions the commit was tested against,
      # and the build fails loudly if the lock file drifts out of step with
      # Cargo.toml instead of silently re-resolving.
      - name: Build
        run: cargo build --locked --all-targets

      - name: Unit tests
        run: cargo test --locked --lib

      # The static checks that keep the documented promises honest: the fidelity
      # matrix, the comparison document, and the README badges all have to agree
      # with tests/conformance/matrix.json, and the workflow files in this
      # directory have to stay parseable.
      - name: Docs and matrix are in sync
        run: |
          cargo test --locked --test fidelity_matrix_tests
          cargo test --locked --test workflow_yaml_tests

      # This repository is public; our issue tracker is not. This target keeps
      # internal ticket ids and links to the tracker's host out of the
      # published tree, where they name nothing a reader can open.
      #
      # It gets a step of its own rather than joining the one above on purpose.
      # It and `workflow_yaml_tests` are a mutual pair — each asserts `ci.yml`
      # still names the other, because neither can assert it is named itself:
      # delete the step and the assertion goes with it. Collapsing the two into
      # one step would mean a single deleted line silences both halves.
      - name: Internal tracker references
        run: cargo test --locked --test public_repo_hygiene_tests

      # Guards that assert *how* a request is served rather than what comes
      # back, so no other suite can see them fail. `local_pushdown_boundary_tests`
      # is the one that catches a `Store` decorator which forwards
      # `scan_collection` but not `scan_collection_filtered` — correct answers,
      # pushdown silently gone. Needs no database: it records the calls a
      # `MemoryStore` stack receives.
      # `local_listen_pushdown_tests` is the same assertion for the other read
      # path: a `Listen` query target is re-evaluated once per change, so losing
      # the pushdown there costs a full collection scan per write per listener.
      - name: Data-plane boundary guards
        run: |
          cargo test --locked --test local_pushdown_boundary_tests
          cargo test --locked --test local_listen_pushdown_tests

      # The other half of that: the supply-chain facts only Cargo.lock and
      # deny.toml record — and, since PR #95 and PR #96, two about this file.
      # The target reads all three off disk and needs no network and no
      # third-party binary, which is exactly why it belongs in this job and not
      # in `deny` below — and it has to be named here, because every cargo
      # invocation in this job names its target, so a test target that no step
      # lists never runs at all.
      #
      # It is also the one check that can report a *widened* gate. cargo-deny
      # cannot: deny.toml is its own input, so relaxing a setting makes it
      # greener, not redder. Keep this step whenever deny.toml gains a policy.
      - name: Supply-chain pins and gate settings
        run: cargo test --locked --test dependency_pin_tests

      # Each of these starts what it needs in-process and talks to it over real
      # gRPC or real HTTP/1.1.
      - name: Local data plane
        run: |
          cargo test --locked --test local_firestore_tests
          cargo test --locked --test local_firestore_listen_tests
          cargo test --locked --test local_datastore_tests
          cargo test --locked --test local_auth_tests

      - name: Export parsing and the library/CLI surface
        run: |
          cargo test --locked --test real_export_validation
          cargo test --locked --test export_fidelity_tests
          cargo test --locked --test library_api_tests
          cargo test --locked --test cli_exit_code_tests

  deny:
    name: supply chain (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The prebuilt release binary rather than EmbarkStudios/cargo-deny-action,
      # for two reasons. The version is pinned to an exact release and the
      # download is checksum-verified, which matters more than usual for the job
      # whose entire job is supply-chain hygiene. And the command below is
      # byte-for-byte the command a developer runs locally, instead of being
      # assembled from an action's inputs — so "it passes on my machine" and "it
      # passes in CI" mean the same thing.
      #
      # Bump CARGO_DENY_VERSION and CARGO_DENY_SHA256 together, deliberately.
      # Get the checksum from the release page or by running sha256sum on the
      # downloaded tarball.
      - name: Install cargo-deny
        env:
          CARGO_DENY_VERSION: 0.20.2
          CARGO_DENY_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          dir="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl -sSfL -o cargo-deny.tar.gz \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${dir}.tar.gz"
          echo "${CARGO_DENY_SHA256}  cargo-deny.tar.gz" | sha256sum -c -
          tar xzf cargo-deny.tar.gz
          # Into a directory we own and add to PATH, so the step needs no sudo.
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 "${dir}/cargo-deny" "${RUNNER_TEMP}/bin/cargo-deny"
          rm -rf cargo-deny.tar.gz "${dir}"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/cargo-deny" --version
          # cargo-deny shells out to `cargo metadata`, so fail here with a clear
          # message if the runner image ever stops shipping a toolchain.
          cargo --version

      # Printed, not enforced: cargo-deny has no expiry mechanism for `ignore`
      # entries and says nothing at all about an advisory it was told to skip.
      # Surfacing the reasons keeps every accepted exception and its review date
      # in the log of every run instead of only in the config file.
      - name: Accepted advisory exceptions
        run: grep -n 'id = "RUSTSEC' deny.toml || echo 'none'

      # `-D advisory-not-detected` turns a stale `ignore` entry from a warning
      # into a failure, so an accepted vulnerability cannot outlive its fix.
      # `--locked` for the same reason the test job uses it: check the exact
      # versions this commit pins, and fail if Cargo.lock has drifted.
      - name: cargo deny check
        run: |
          cargo-deny --locked check \
            -D advisory-not-detected \
            advisories licenses bans sources

  # The fidelity regression gate: every official-SDK smoke suite (Firestore,
  # Auth, Datastore) against both stores, compared with
  # tests/smoke-gate/baseline.json. It fails when a check that passes on `main`
  # fails or goes missing, and names the check; a new check, or one that newly
  # passes, never fails it. It also fails when a row of the fidelity matrix is
  # neither proven by a passing smoke check tagged with its status nor listed in
  # tests/smoke-gate/matrix-gaps.json, and names the row. Updating the baseline
  # is a reviewed diff — see "Fidelity regression gate" in docs/local/README.md.
  #
  # The exception to this file's "no external services" rule, kept to its own
  # job so the `test` job stays that way. It needs the Google client libraries
  # from npm and a PostgreSQL service container, because a durable store that
  # disagrees with the in-memory one is exactly the regression to catch.
  #
  # This job is a required status check on `main`, by its `name:` below — so
  # renaming it unbinds the requirement. And neither the job nor the gate step
  # may carry an `if:` or `continue-on-error:` that switches it off: a skipped
  # job satisfies a required check. `fidelity_matrix_tests`, in the `test` job,
  # fails if either appears.
  fidelity:
    name: fidelity smoke gate (official SDKs)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fireup_fidelity
          POSTGRES_USER: fireup
          POSTGRES_PASSWORD: fireup_ci_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          cargo --version && rustc --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            tests/local-smoke/package-lock.json
            tests/local-smoke-datastore/package-lock.json

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-fidelity-${{ hashFiles('Cargo.lock') }}

      # `--locked` here, once, because the smoke scripts build without it. With
      # the binary already built from the pinned lock file, their own
      # `cargo build` has nothing left to resolve.
      - name: Build
        run: cargo build --locked --bin fireup

      - name: Install the official client libraries
        run: |
          npm ci --no-audit --no-fund --prefix tests/local-smoke
          npm ci --no-audit --no-fund --prefix tests/local-smoke-datastore

      # The comparison rule and the baseline's coverage of the suite runs; the
      # matrix-coverage rule with the smoke suites' row tags and
      # matrix-gaps.json; and the triage role's clustering rule, which reads the
      # same results files. All before the minutes-long part.
      - name: Gate rule
        run: node --test tests/smoke-gate/compare.test.mjs tests/smoke-gate/matrix-coverage.test.mjs tests/smoke-gate/cluster.test.mjs

      - name: Fidelity regression gate
        env:
          FIREUP_SMOKE_POSTGRES_URL: postgresql://fireup:fireup_ci_password@localhost:5432/fireup_fidelity
        run: scripts/fidelity-smoke-gate.sh
