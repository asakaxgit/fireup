version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: fireup_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fireup_dev}
      POSTGRES_USER: ${POSTGRES_USER:-fireup}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fireup_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      # Enable logging for development
      POSTGRES_LOG_STATEMENT: all
      POSTGRES_LOG_MIN_DURATION_STATEMENT: 0
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Only files directly in /docker-entrypoint-initdb.d run. The entrypoint
      # does not recurse, so do not add a directory mount here expecting the
      # .sql files inside it to be executed.
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fireup_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fireup} -d ${POSTGRES_DB:-fireup_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Add resource limits for development
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # `fireup local` — the Firestore- and Firebase-Auth-compatible data plane,
  # storing documents and accounts in the Postgres service above so they survive
  # `docker compose restart`.
  #
  # One port carries all of it: Firestore gRPC (HTTP/2), the Identity Toolkit
  # REST surface, and the HTTP/1.1 health + discovery routes. Point SDKs at it
  # with both documented variables:
  #
  #   export FIRESTORE_EMULATOR_HOST=127.0.0.1:4589
  #   export FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:4589
  #
  # Local development only: the auth surface mints unsigned tokens and checks no
  # credential. Do not publish this port beyond a development machine.
  fireup-local:
    build:
      context: .
      dockerfile: Dockerfile
    image: fireup:local
    container_name: fireup_local
    command:
      - local
      # Containers need a reachable bind address; the loopback default would
      # only be visible from inside the container.
      - --host=0.0.0.0
      - --port=4589
      - --postgres-url=postgresql://${POSTGRES_USER:-fireup}:${POSTGRES_PASSWORD:-fireup_dev_password}@postgres:5432/${POSTGRES_DB:-fireup_dev}
      - --project-id=${FIREUP_LOCAL_PROJECT_ID:-fireup-local}
    environment:
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${FIREUP_LOCAL_PORT:-4589}:4589"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fireup_network
    # Asks the server the same question a client would, over the real port, and
    # the answer depends on the database being reachable. No curl in the image,
    # so this uses bash's /dev/tcp.
    # `bash` explicitly, not CMD-SHELL: /dev/tcp is a bash feature and the
    # image's /bin/sh is dash.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/4589 &&
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q '200'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  fireup_network:
    driver: bridge