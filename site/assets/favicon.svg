<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Fireup">
  <!-- MASTER, drawn for 32px. Its own drawing again: at 32 there is room to
       step the tongue twice so it tapers, which does not fit at 16.
       stem 6px, bars 6px, counter 3px, tongue in three steps above the bar. -->
  <rect width="32" height="32" fill="#0B1220"/>
  <rect x="6"  y="9"  width="6"  height="21" fill="#FFFFFF"/>
  <rect x="6"  y="18" width="12" height="6"  fill="#FFFFFF"/>
  <rect x="6"  y="9"  width="20" height="6"  fill="#FF5A2B"/>
  <rect x="18" y="6"  width="8"  height="3"  fill="#FF5A2B"/>
  <rect x="20" y="3"  width="5"  height="3"  fill="#FF5A2B"/>
  <rect x="21" y="1"  width="3"  height="2"  fill="#FF5A2B"/>
</svg>
