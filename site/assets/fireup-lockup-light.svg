       Clear space on all sides: 18.0 units of this viewBox.
       Minimum size: 96px wide — below that, use the mark alone. -->
  <g transform="translate(-9.00 -40.00) scale(1.5000)">
  <!-- Fireup mark: an F whose top bar runs out and catches, the fire blowing up
       and to the right off its end. Fireup is what you run to bring a stack up,
       so the mark is the moment it fires.

       Why it is drawn this way, from brand/scripts/plain.mjs (round 5) and
       lighter.mjs (round 4):
         * There is no muzzle. Round 4 ran a half-weight nozzle out of the bar
           to carry the lighter read; the note on it was "omit nozzle entirely",
           so the bar is one weight end to end.
         * The fire's base spans the bar's full 12 weight, so the join is a seam
           rather than a step — the bar's end is the fire. A 9-unit base, which
           is what sat on the nozzle, notches the silhouette 2 units above the
           bar and 1 below.
         * The fire has a belly and a second shorter tongue. A single tapered
           jet along the bar reads as a swoosh and a 45-degree blade reads as a
           leaf; the notch between two tongues is what makes it fire.
         * The bar stops at 36. At 32 it ends only 4 units past the middle arm
           and the fire becomes the widest thing in the mark; at 40 the letter
           outweighs the fire.
         * Nothing floats. The fire is a terminal of the letterform, because a
           free-standing flame silhouette is Firebase's mark and Tinder's.
       The counter stays open on the right, so this is still an F at 16px, which
       is where it is used most.

       Geometry on a 64-unit grid. Bar weight 12, counter 6.
       data-cap-top/bottom mark the F's own cap line — the flame overshoots
       above it the way a diacritic does, and the lockup aligns to the cap.
       Everything stays inside x<=60 and y>=1: in round 4's first drawing the
       flame ran past 64 and the renderer clipped its outer lobe flat. -->
