[package]
name = "fireup"
version = "0.1.0"
edition = "2021"
description = "Migration tool for Firestore to PostgreSQL with dual compatibility"
authors = ["Fireup Team"]
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# PostgreSQL client
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# File parsing (will implement custom LevelDB parser)
bytes = "1.5"
crc32fast = "1.3"

# CLI
clap = { version = "4.0", features = ["derive"] }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.7"
dashmap = "5.5"

# SQL parsing
sqlparser = "0.39"

# Monitoring and metrics
once_cell = "1.19"

# Protocol Buffers (Datastore / Firestore entity wire format)
prost = "0.12"
prost-types = "0.12"

# gRPC server for `fireup local` (pinned to the tonic line that tracks prost 0.12
# so the local data plane and the export parser share one prost version)
tonic = "0.11"
tokio-stream = { version = "0.1", features = ["net"] }

# Async trait methods for the `Store` trait. Already in the tree via tonic;
# declared directly because `src/local/store.rs` uses it.
async-trait = "0.1"

# JWT segment encoding for `fireup local`'s auth surface (`src/local/auth`).
# Already in the tree transitively, so declaring it adds no new third-party code.
base64 = "0.22"

# Salted password digests for locally stored accounts. See the warning on
# `src/local/auth/user.rs::PasswordHash`: local development only.
sha2 = "0.11"

[build-dependencies]
# Protocol Buffer compilation
protoc-bin-vendored = "3.2"
prost-build = "0.12"
tonic-build = { version = "0.11", default-features = false, features = ["prost", "transport"] }

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[[test]]
name = "deployment_tests"
path = "tests/deployment_tests.rs"
[[test]]
name = "real_export_validation"
path = "tests/real_export_validation.rs"

[[test]]
name = "export_fidelity_tests"
path = "tests/export_fidelity_tests.rs"

[[test]]
name = "postgres_import_tests"
path = "tests/postgres_import_tests.rs"

[[test]]
name = "cli_exit_code_tests"
path = "tests/cli_exit_code_tests.rs"

[[test]]
name = "library_api_tests"
path = "tests/library_api_tests.rs"

[[test]]
name = "local_firestore_tests"
path = "tests/local_firestore_tests.rs"

[[test]]
name = "local_datastore_tests"
path = "tests/local_datastore_tests.rs"

[[test]]
name = "local_postgres_store_tests"
path = "tests/local_postgres_store_tests.rs"

[[test]]
name = "local_auth_tests"
path = "tests/local_auth_tests.rs"

[[test]]
name = "local_auth_postgres_tests"
path = "tests/local_auth_postgres_tests.rs"

[[test]]
name = "fidelity_matrix_tests"
path = "tests/fidelity_matrix_tests.rs"
