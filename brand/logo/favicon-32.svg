<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Fireup">
  <!-- MASTER, drawn for 32px. Its own drawing again: at 32 there is room for
       the 4px gap that carries the "lifted row" idea, which does not fit at 16.
       stem 6px, arms 6px, gaps 4px, overhang 2px. -->
  <rect width="32" height="32" fill="#0B1220"/>
  <rect x="5"  y="4"  width="6"  height="24" fill="#FFFFFF"/>
  <rect x="5"  y="4"  width="20" height="6"  fill="#FFFFFF"/>
  <rect x="15" y="14" width="12" height="6"  fill="#FF5A2B"/>
</svg>
