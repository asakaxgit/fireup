<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Fireup">
  <!-- MASTER, drawn for 16px. Not the 64-unit mark scaled down: at this size
       the flame's notch lands inside a single pixel and turns to grey mush, so
       the fire is re-cut as three whole-pixel blocks stepping up and to the
       right off the muzzle. One tongue, not two — at 16px there is no room for
       a notch. stem 3px, bars 3px, counter 2px, muzzle 1px. The muzzle is the
       one lighter cue that survives here, and only because it sits on a whole
       pixel row. -->
  <rect width="16" height="16" fill="#0B1220"/>
  <rect x="2"  y="4" width="3" height="11" fill="#FFFFFF"/>
  <rect x="2"  y="4" width="6" height="3"  fill="#FFFFFF"/>
  <rect x="2"  y="9" width="5" height="3"  fill="#FFFFFF"/>
  <rect x="8"  y="5" width="2" height="1"  fill="#FFFFFF"/>
  <rect x="10" y="4" width="3" height="4"  fill="#FF5A2B"/>
  <rect x="11" y="2" width="3" height="2"  fill="#FF5A2B"/>
  <rect x="12" y="1" width="2" height="1"  fill="#FF5A2B"/>
</svg>
