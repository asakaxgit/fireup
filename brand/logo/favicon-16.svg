<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-label="Fireup">
  <!-- MASTER, drawn for 16px. Not the 64-unit mark scaled down: at this size
       the flame's curve lands on a pixel and a half and turns to grey mush, so
       the tongue is re-cut as a block that sits on whole pixels.
       stem 3px, bars 3px, counter 2px, tongue in two steps above the bar.
       The step is what makes it a tongue: a flush 3x3 block on the bar's end
       renders as a thick corner, not as fire. Rendered both and compared. -->
  <rect width="16" height="16" fill="#0B1220"/>
  <rect x="3" y="4"  width="3"  height="11" fill="#FFFFFF"/>
  <rect x="3" y="9"  width="6"  height="3"  fill="#FFFFFF"/>
  <rect x="3" y="4"  width="10" height="3"  fill="#FF5A2B"/>
  <rect x="9" y="3"  width="4"  height="1"  fill="#FF5A2B"/>
  <rect x="9" y="1"  width="3"  height="2"  fill="#FF5A2B"/>
</svg>
